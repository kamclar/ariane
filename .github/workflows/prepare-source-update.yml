name: Prepare source update

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to prepare as a draft pull request
        required: true
        type: choice
        options:
          - enigma_erepo_vcep_assertions

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-source-update-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Build candidate snapshot and review report
        id: candidate
        run: |
          review_path="docs/source_update_reviews/enigma_erepo_$(date -u +%F).md"
          python scripts/prepare_source_update.py \
            --source "${{ inputs.source }}" \
            --review-output "$review_path" \
            --write
          echo "review_path=$review_path" >> "$GITHUB_OUTPUT"

      - name: Validate complete candidate
        run: |
          python scripts/check_source_updates.py \
            --source "${{ inputs.source }}" \
            --validate-registry
          python -m ruff check .
          python -m mypy
          python -m pytest
          python -m pytest experiments/spliceai_distance/tests
          git diff --check

      - name: Create draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="source-update/${{ inputs.source }}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add \
            backend/data/enigma_erepo_vcep_registry.json \
            backend/data/enigma_erepo_vcep_registry.metadata.json \
            backend/version.py \
            data/sources/source_watch_registry.json \
            docs/source_update_reviews
          git commit -m "data: prepare reviewed ENIGMA ERepo update"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --draft \
            --title "Data update: ClinGen ERepo ENIGMA assertions" \
            --body-file "${{ steps.candidate.outputs.review_path }}"
