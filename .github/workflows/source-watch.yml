name: Upstream source watch

on:
  schedule:
    # Weekly checks are inexpensive and also satisfy the 30-day checks.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check official sources without activating them
        id: source_watch
        run: |
          set +e
          python scripts/check_source_updates.py \
            --output /tmp/ariane-source-watch.json \
            --markdown-output /tmp/ariane-source-watch.md
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          # Exit 2 is an expected review notice, not a CI failure. A later step
          # still fails the workflow for technical/configuration errors.
          exit 0

      - name: Publish source-watch summary
        if: always()
        run: |
          if test -f /tmp/ariane-source-watch.md; then
            cat /tmp/ariane-source-watch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# ARIANE source-watch report" >> "$GITHUB_STEP_SUMMARY"
            echo "The checker failed before it could create a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create or update the source-review notice
        if: >-
          steps.source_watch.outputs.exit_code == '0' ||
          steps.source_watch.outputs.exit_code == '2'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_WATCH_ASSIGNEE: ${{ github.repository_owner }}
        run: >-
          python scripts/sync_source_watch_issue.py
          --report /tmp/ariane-source-watch.json
          --markdown /tmp/ariane-source-watch.md
          --repository "${{ github.repository }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail only when a source could not be checked
        if: >-
          steps.source_watch.outputs.exit_code != '0' &&
          steps.source_watch.outputs.exit_code != '2'
        run: |
          echo "The source watch did not complete. See the job summary."
          exit 1
