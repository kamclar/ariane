        <!-- Search form (single mode) -->
        <section class="search-section" x-show="mode === 'single'">
            <form @submit.prevent="classify()">
                <div class="form-row">
                    <div class="form-group">
                        <label for="gene">Gene</label>
                        <select id="gene" x-model="gene" @change="syncGeneFromVariantInput()"
                                x-on:change.debounce="loadManualDefinitions()" required>
                            <template x-for="item in configuredGenes" :key="item.symbol">
                                <option :value="item.symbol" x-text="item.symbol"></option>
                            </template>
                        </select>
                    </div>
                    <div class="form-group form-group-wide">
                        <label for="c_notation">Variant</label>
                        <input type="text" id="c_notation" x-model="c_notation"
                               @input="syncGeneFromVariantInput()"
                               placeholder="e.g. c.5217T>A or chr17:43070945:A>T" required>
                    </div>
                    <div class="form-group assembly-group"
                         x-show="isGenomicInput()" x-transition>
                        <label for="assembly">Genome assembly</label>
                        <select id="assembly" x-model="assembly"
                                :required="isGenomicInput()">
                            <option value="">Select assembly</option>
                            <option value="GRCh37">GRCh37 / hg19</option>
                            <option value="GRCh38">GRCh38 / hg38</option>
                        </select>
                    </div>
                    <div class="form-group" x-show="c_notation.toLowerCase().includes('dup')">
                        <label for="dup_type">Duplication arrangement</label>
                        <select id="dup_type" x-model="dup_type">
                            <option value="Unknown">Unknown</option>
                            <option value="Tandem">Confirmed tandem</option>
                        </select>
                    </div>
                    <div class="form-group form-group-btn">
                        <button type="submit"
                                :disabled="loading || (isGenomicInput() && !assembly)">
                            <span x-show="!loading">Classify</span>
                            <span x-show="loading">Analysing...</span>
                        </button>
                    </div>
                </div>
            </form>
            <p class="input-hint" x-show="error" x-text="error" style="color: var(--color-error);"></p>
            <p class="input-hint" x-show="geneInputConflict && !error" x-text="geneInputConflict" style="color: var(--color-error);"></p>
            <p class="input-hint" x-show="geneAutoSwitchNotice" x-text="geneAutoSwitchNotice" style="color: var(--color-primary);"></p>
            <p class="input-hint" x-show="resourceError" x-text="resourceError" style="color: var(--color-warning);"></p>
            <p class="input-hint">
                Reference transcript:
                <strong x-text="transcriptByGene[gene] || 'not configured'"></strong>.
                ARIANE derives and verifies canonical c. and three-letter p. HGVS locally.
                <span x-show="!isGenomicInput()">Genome assembly is not needed for c. HGVS.</span>
                <span x-show="isGenomicInput()">Select GRCh37 or GRCh38 for the genomic coordinate.</span>
            </p>
            <p class="input-hint" x-show="c_notation.toLowerCase().includes('dup')">
                Select Confirmed tandem only when supported by laboratory data. Otherwise keep Unknown.
            </p>
        </section>
