[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".pytest_tmp_*",
    ".test-tmp-*",
    ".tmp_enigma_*",
    ".runtime-cache",
    ".runtime-data",
    "build",
    "outputs",
]

[tool.ruff.lint]
# Establish a zero-warning baseline for syntax, undefined names, duplicate
# definitions and invalid imports. Broader style rules can be enabled without
# weakening this safety baseline.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These command-line scripts add the repository root to sys.path before
# importing application modules. The imports must therefore follow bootstrap.
"scripts/build_intronic_reference_cache.py" = ["E402"]
"scripts/build_spliceai_reference_caches.py" = ["E402"]
"scripts/manage_api_keys.py" = ["E402"]
"scripts/validate_ps1_protein_registry.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = [
    "backend/domain",
    "backend/policy/classification.py",
    "backend/presentation/frontend.py",
]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
